name: Pull request quality and parity

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm check

  browser:
    name: Chromium parity on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise exec -- pnpm test:browser
        env:
          PARITY_SERVER_MODE: build
          PARITY_IGNORE_HOST_BASELINES: '1'
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: linux-parity-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
