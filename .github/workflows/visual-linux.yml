name: Generate Linux visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshots:
    name: Generate Chromium Linux snapshots for review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm exec playwright install --with-deps chromium
      - run: mise exec -- pnpm test:browser --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: linux-snapshots
          path: tests/browser/**/*-linux.png
          if-no-files-found: error
