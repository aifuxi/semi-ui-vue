name: Publish npm packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  browser:
    name: Chromium parity on Darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:browser
        env:
          PARITY_IGNORE_HOST_BASELINES: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: darwin-parity-failure
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish with npm OIDC
    if: github.ref_name != 'v0.1.0-alpha.0'
    needs:
      - quality
      - browser
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.16.0
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:theme-dist
      - run: pnpm verify:ssr-dist
      - run: pnpm verify:pack-dist
      - run: pnpm release:verify
      - run: pnpm release:publish
