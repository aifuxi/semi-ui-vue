name: Publish npm packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm audit:prod
      - run: mise exec -- pnpm check

  browser:
    name: Chromium parity on Darwin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm exec playwright install chromium
      - run: mise exec -- pnpm test:browser
        env:
          PARITY_IGNORE_HOST_BASELINES: '1'
      - run: mise exec -- pnpm test:browser:docs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: darwin-parity-failure
          path: |
            playwright-report
            test-results
            apps/docs/playwright-report
            apps/docs/test-results
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish with npm OIDC
    if: github.ref_name != 'v0.1.0-alpha.0'
    needs:
      - quality
      - browser
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.3
      - run: mise exec -- npm install --global npm@11.16.0 --registry=https://registry.npmjs.org/
      - run: mise exec -- pnpm install --frozen-lockfile
      - run: mise exec -- pnpm build
      - run: mise exec -- pnpm verify:theme-dist
      - run: mise exec -- pnpm verify:ssr-dist
      - run: mise exec -- pnpm verify:pack-dist
      - run: mise exec -- pnpm release:verify
      - run: mise exec -- pnpm release:publish
