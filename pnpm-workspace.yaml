packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0
    # VitePress 的 @vueuse/integrations 声明 async-validator ^4；仓库固定 3.5.2，文档站不使用该集成。
    async-validator: '3.5.2'
  ignoreMissing:
    # @docsearch 仅在本站使用 Algolia 搜索时才需要；文档站使用本地索引。
    - search-insights

overrides:
  '@types/react': 18.0.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.5'
