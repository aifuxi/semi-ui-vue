packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0

overrides:
  # The reference adapter resolves these imports directly to vendor/semi-design v2.102.0.
  '@douyinfe/semi-site-header>@douyinfe/semi-ui': '-'
  '@douyinfe/semi-site-header>@douyinfe/semi-icons': '-'
  '@types/react': 18.0.5

allowBuilds:
  esbuild: true
