packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

onlyBuiltDependencies:
  - esbuild

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0

overrides:
  '@types/react': 18.0.5
  '@tiptap/core': 3.10.7
