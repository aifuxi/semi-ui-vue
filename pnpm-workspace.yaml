packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0

overrides:
  # The reference adapter resolves these imports directly to vendor/semi-design v2.102.0.
  '@douyinfe/semi-site-header>@douyinfe/semi-ui': '-'
  '@douyinfe/semi-site-header>@douyinfe/semi-icons': '-'
  '@types/react': 18.0.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Nuxt Content's metadata tool supplies older optional peers to unctx 3.
# Give the transform its own compatible parser/plugin dependencies.
packageExtensions:
  'unctx@3.0.1':
    dependencies:
      oxc-parser: 0.149.0
      unplugin: 3.3.0
minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.5'
patchedDependencies:
  '@rstest/coverage-v8@0.11.12': patches/@rstest__coverage-v8@0.11.12.patch
