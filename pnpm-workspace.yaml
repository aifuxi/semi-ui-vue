packages:
  - apps/*
  - packages/*
  - tools/*

autoInstallPeers: false
engineStrict: true
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.42
  '@vue/server-renderer': 3.5.42
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0
    # VitePress 的 @vueuse/integrations 声明 async-validator ^4；仓库固定 3.5.2，文档站不使用该集成。
    async-validator: '3.5.2'
  ignoreMissing:
    # @docsearch 仅在本站使用 Algolia 搜索时才需要；文档站使用本地索引。
    - search-insights

overrides:
  '@types/react': 18.0.5
  # VitePress 1 的 Vite 5 已停止安全更新；官方维护者确认 v1 可覆盖到 Vite 6。
  'vitepress>vite': 6.4.5
  # 修复传递依赖中 indexed source map 偏移导致的事件循环阻塞。
  'source-map-js@<1.2.2': 1.2.2

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.5'
# 公开产物内联播放器；固定 5.13.0 的就绪轮询必须随所属 window 销毁。
patchedDependencies:
  lottie-web@5.13.0: patches/lottie-web@5.13.0.patch
