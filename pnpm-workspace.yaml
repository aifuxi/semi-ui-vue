packages:
  - apps/*
  - packages/*

autoInstallPeers: false
engineStrict: true
pmOnFail: error
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true

catalog:
  vue: 3.5.41
  '@vue/server-renderer': 3.5.41
  react: 16.14.0
  react-dom: 16.14.0
  normalize.css: 8.0.1
  typeface-inter: 3.18.1

peerDependencyRules:
  allowedVersions:
    react: 16.14.0
    react-dom: 16.14.0

overrides:
  '@types/react': 18.0.5

allowBuilds:
  '@parcel/watcher': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@rsbuild/core@2.2.5'
patchedDependencies:
  '@rstest/coverage-v8@0.11.12': patches/@rstest__coverage-v8@0.11.12.patch
